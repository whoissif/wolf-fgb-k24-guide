<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">Esquema funcional FGB-K</title><desc id="d">Diagrama conceptual de generador, calefacción, producción de ACS por intercambiador de placas y evacuación de condensados.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#176c55"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#b85c32"/></marker></defs><rect x="12" y="12" width="876" height="516" rx="22" fill="#f7faf7" stroke="#dce4dc"/><text x="42" y="56" font-family="Arial" font-size="17" font-weight="700" fill="#123d34">DIAGRAMA DE PRINCIPIO · NO USAR COMO PLANO DE MONTAJE</text><rect x="64" y="106" width="300" height="320" rx="18" fill="#fff" stroke="#123d34" stroke-width="3"/><text x="214" y="143" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#123d34">WOLF FGB-K-24</text><rect x="132" y="174" width="164" height="96" rx="12" fill="#e8f3ec" stroke="#87ad98" stroke-width="2"/><path d="M178 242c-15-21 16-28 2-49 35 15 37 34 20 49 1-13-7-18-12-22-1 12-6 16-10 22z" fill="#d58743"/><text x="214" y="293" text-anchor="middle" font-family="Arial" font-size="15" fill="#43574b">Quemador + intercambiador</text><circle cx="214" cy="341" r="24" fill="#fff" stroke="#176c55" stroke-width="3"/><path d="M201 341h26m-13-13v26" stroke="#176c55" stroke-width="3"/><text x="214" y="390" text-anchor="middle" font-family="Arial" font-size="14" fill="#43574b">Bomba / control</text><path d="M364 202h118v-38h272v72H520" fill="none" stroke="#b85c32" stroke-width="8" marker-end="url(#b)"/><path d="M520 274h234v52H364" fill="none" stroke="#4789aa" stroke-width="8" marker-end="url(#a)"/><rect x="575" y="126" width="178" height="126" rx="12" fill="#fff" stroke="#b85c32" stroke-width="2"/><text x="664" y="157" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#123d34">CIRCUITO</text><text x="664" y="179" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#123d34">CALEFACCIÓN</text><text x="664" y="213" text-anchor="middle" font-family="Arial" font-size="13" fill="#43574b">ida caliente ↑</text><text x="664" y="236" text-anchor="middle" font-family="Arial" font-size="13" fill="#43574b">retorno frío ↓</text><rect x="575" y="306" width="178" height="86" rx="12" fill="#fff" stroke="#4789aa" stroke-width="2"/><text x="664" y="337" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#123d34">ACS INSTANTÁNEA</text><text x="664" y="365" text-anchor="middle" font-family="Arial" font-size="13" fill="#43574b">Intercambiador de placas</text><path d="M364 244h82v103h129" fill="none" stroke="#5c8fa8" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#a)"/><path d="M577 359h-94V243" fill="none" stroke="#8d6cab" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="447" y="216" text-anchor="middle" font-family="Arial" font-size="12" fill="#52635a">demanda de ACS: calor al intercambiador</text><path d="M215 426v53h164" fill="none" stroke="#6a9a72" stroke-width="5" marker-end="url(#a)"/><path d="M379 470c12 19 22 19 34 0" fill="none" stroke="#6a9a72" stroke-width="5"/><text x="220" y="508" font-family="Arial" font-size="13" fill="#43574b">Sifón → desagüe de condensados</text><text x="463" y="456" font-family="Arial" font-size="12" fill="#68766e">Las líneas representan intercambio/flujo conceptual,</text><text x="463" y="475" font-family="Arial" font-size="12" fill="#68766e">no ubicación ni trazado real de tuberías.</text></svg>
